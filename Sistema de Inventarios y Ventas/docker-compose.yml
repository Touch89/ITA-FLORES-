services:
  mariadb:
    image: mariadb:11
    container_name: ita-flores-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      # Bound to loopback only — this is dev/debug access to the DB (a local client, `mariadb`
      # CLI), not something the app needs from outside the container (the frontend service reaches
      # mariadb over the internal docker network via DB_HOST, not this published port). Publishing
      # it on 0.0.0.0 would put a DB with example/weak .env passwords on the network.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  adminer:
    image: adminer:latest
    container_name: ita-flores-adminer
    restart: unless-stopped
    ports:
      # Same reasoning as mariadb's port above — a DB admin UI has no business being reachable from
      # outside the machine running it.
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ita-flores-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  db_data:
